# Keeps the Family Shield free Render instance warm in the daytime (about 6:00 AM-10:00 PM MT).
# GitHub cron is UTC; 13:00-04:59 UTC = 6 AM-9:59 PM MST (7 AM-10:59 PM during MDT).
name: keep-warm-family-shield
on:
  schedule:
    - cron: "*/10 0-4,13-23 * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ secrets.FS_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then echo "::warning::FS_HEALTH_URL secret not set"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 2 --max-time 90 "$URL" || echo 000)
          echo "health=$code"
          [ "$code" = "200" ] || echo "::warning::health returned $code"
