# BotSupply — Docker web service.
# Free instances have an ephemeral filesystem. SQLite under /data survives
# only for the life of the instance. A paid plan can add a disk mounted at
# /data; see DEPLOY.md. Do not attach a disk on the free plan.
services:
  - type: web
    name: botsupply
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://botsupply.onrender.com
      # Fill these in the Dashboard. Do not commit secret values.
      # On an already-created service, add them under Environment; sync: false
      # is not re-prompted on later Blueprint updates.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
